<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>You’re in! | SF Recipes</title>
    <meta name="description" content="Your subscription is confirmed. We’ll let you know as soon as sfrecipes launches.">
    <!-- Post-confirmation page from the Kit email: keep it out of search results -->
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://sfrecipes.org/subscribed/">
    <meta name="theme-color" content="#0f1013">
    <meta name="color-scheme" content="dark">

    <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="icon" href="/assets/favicon-16.png" sizes="16x16" type="image/png">
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="preload" href="/fonts/koulen-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>

    <style>
        @font-face {
            font-family: 'Koulen';
            src: url('/fonts/koulen-latin.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            /* tiny and preloaded: wait for it instead of flashing a fallback */
            font-display: block;
        }

        @font-face {
            font-family: 'Inter';
            src: url('/fonts/inter-latin.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        /* Arial tuned to Inter's metrics, so the swap doesn't shift the layout */
        @font-face {
            font-family: 'Inter Fallback';
            src: local('Arial'), local('Helvetica');
            ascent-override: 90.44%;
            descent-override: 22.52%;
            line-gap-override: 0%;
            size-adjust: 107.12%;
        }

        :root {
            --color-bg: #0f1013;
            --color-accent: #f29a2e;
            --color-text: #f4f4f5;
            --color-text-muted: #a1a1aa;
            --color-text-subtle: #71717a;
            --color-surface-raised: #1f2126;
            --color-border: #2a2c33;
            --color-border-strong: #3a3d46;
            --color-success: #34d399;
            --color-success-soft: #152a26;
            --color-success-border: #235d4c;
            --radius-md: 12px;
            --font-display: 'Koulen', Impact, 'Arial Narrow', sans-serif;
            --font-body: 'Inter', 'Inter Fallback', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --gutter: 16px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        p, h1 {
            margin: 0;
        }

        img {
            display: block;
        }

        .page {
            position: relative;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            min-height: 100svh;
            overflow: hidden;
        }

        .header {
            position: relative;
            display: flex;
            align-items: center;
            height: 60px;
            padding: 0 var(--gutter);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 24px;
            line-height: 1.1;
            letter-spacing: 0.01em;
            color: var(--color-text);
            text-decoration: none;
        }

        .logo span {
            color: var(--color-accent);
        }

        .content {
            position: relative;
            flex: 1 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 24px var(--gutter);
            text-align: center;
        }

        .glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% - 39px));
            pointer-events: none;
        }

        .glow img {
            max-width: none;
        }

        .glow--desktop {
            display: none;
        }

        .content > :not(.glow) {
            position: relative;
        }

        .badge {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border: 1.5px solid var(--color-success-border);
            border-radius: 50%;
            background: var(--color-success-soft);
        }

        .badge img {
            width: 34px;
            height: 34px;
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--color-success);
        }

        .title {
            font-family: var(--font-display);
            font-weight: normal;
            font-size: 64px;
            line-height: 0.92;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--color-text);
        }

        .lead {
            max-width: 358px;
            font-size: 15px;
            line-height: 1.55;
            color: var(--color-text-muted);
        }

        .actions {
            display: flex;
            width: 100%;
            padding-top: 8px;
        }

        .button {
            display: inline-flex;
            flex: 1 1 auto;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 24px;
            border: 1px solid var(--color-border-strong);
            border-radius: var(--radius-md);
            background: var(--color-surface-raised);
            color: var(--color-text);
            font-size: 16px;
            font-weight: 500;
            line-height: 20px;
            white-space: nowrap;
            text-decoration: none;
            transition: border-color .15s;
        }

        .button:hover {
            border-color: var(--color-text-subtle);
        }

        .button:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .footer {
            position: relative;
            display: flex;
            justify-content: center;
            padding: 20px var(--gutter) 28px;
            border-top: 1px solid var(--color-border);
            font-size: 13px;
            line-height: 1.5;
            color: var(--color-text-subtle);
        }

        @media (min-width: 768px) {
            :root {
                --gutter: clamp(32px, 8.33vw, 120px);
            }

            .header {
                height: 72px;
            }

            .logo {
                font-size: 30px;
            }

            .content {
                gap: 24px;
            }

            .glow {
                transform: translate(-50%, calc(-50% - 14px));
            }

            .glow--mobile {
                display: none;
            }

            .glow--desktop {
                display: block;
            }

            .badge {
                width: 88px;
                height: 88px;
            }

            .badge img {
                width: 40px;
                height: 40px;
            }

            .title {
                font-size: 112px;
            }

            .lead {
                max-width: 540px;
                font-size: 18px;
            }

            .actions {
                width: auto;
            }

            .footer {
                padding-bottom: 24px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WTXRD2310C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-WTXRD2310C');
        gtag('event', 'newsletter_confirmed');
    </script>
</head>
<body>
<div class="page">
    <header class="header">
        <a class="logo" href="/" aria-label="SF Recipes — home"><span>SF</span>RECIPES</a>
    </header>

    <main class="content">
        <div class="glow glow--mobile" aria-hidden="true">
            <img src="/assets/glow-success-mobile.svg" width="840" height="740" alt="">
        </div>
        <div class="glow glow--desktop" aria-hidden="true">
            <img src="/assets/glow-success-desktop.svg" width="1480" height="1000" alt="">
        </div>

        <div class="badge" aria-hidden="true">
            <picture>
                <source media="(min-width: 768px)" srcset="/assets/icon-check.svg">
                <img src="/assets/icon-check-mobile.svg" width="34" height="34" alt="">
            </picture>
        </div>

        <p class="eyebrow">Subscription confirmed</p>

        <h1 class="title">You’re in!</h1>

        <p class="lead">
            Thanks for confirming your email. We’ll let you know as soon as sfrecipes launches — and send a few
            updates on the way.
        </p>

        <div class="actions">
            <a class="button" href="/">Back to sfrecipes</a>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 sfrecipes.org</p>
    </footer>
</div>
</body>
</html>
