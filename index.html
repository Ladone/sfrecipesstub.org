<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Street Fighter recipes | sfrecipes.org</title>
    <style>
        body {
            background: #232323;
        }

        .string {
            color: #51b925;
            margin: 4px 0;
        }

        .dib {
            display: inline-block;
        }
        
        .block {
            display: inline-block;
            width: 4px;
            height: 10px;
            background: #51b925;
            transition: 0.5s;
            animation: blinker 1s step-start infinite;
        }

        @font-face {
            font-family: 'Koulen-regular';
            src: url('./Koulen-Regular.ttf');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        .main-logo {
            margin: 50px 0 10px;
            text-align: center;
            color: #FFF;
            font-size: 142px;
            font-family: "Koulen-regular";
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            user-select: none;
            line-height: 100px;
            font-weight: 100;

            &> span {
               color: #FF9900;
            }
        }

        .main-container {
            p {
                text-align: center;
                color: #fff;
                font-family: "Koulen-regular";
                font-weight: 100;
                font-size: 20px;
                line-height: 10px;
            }
        }
        

        @keyframes blinker {
            50% {
                opacity: 0;
            }
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WTXRD2310C"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-WTXRD2310C');
    </script>
</head>
<body>
<div class="main-container">
    <h1 class="main-logo">
        <span>SF</span>RECIPES
    </h1>
    
    <p>#streetfighter</p>
    <p>out 2026</p>
</div>
</body>
</html>
